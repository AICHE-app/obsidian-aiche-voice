name: Attest Release Assets

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  attest:
    # Only run in the public repo (where the built assets exist). In the private
    # source repo there is no main.js/styles.css to attest, so skip instead of failing.
    if: github.repository == 'AICHE-app/obsidian-aiche-voice'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            styles.css
